version: "3"

env:
  GOTOOLCHAIN: auto
  GOPROXY: https://proxy.golang.org,direct
  APP_VERSION:
    sh: echo -n "${APP_VERSION:-$(git rev-parse --short HEAD)-dev}"
  UID:
    sh: '{{if ne OS "windows"}}id -u{{end}}'
  GID:
    sh: '{{if ne OS "windows"}}id -g{{end}}'

dotenv: [".env"]

includes:
  docker: ./scripts/tasks/docker.yml
  amberelec: ./scripts/tasks/amberelec.yml
  arkos: ./scripts/tasks/arkos.yml
  armada: ./scripts/tasks/armada.yml
  batocera: ./scripts/tasks/batocera.yml
  bazzite: ./scripts/tasks/bazzite.yml
  chimeraos: ./scripts/tasks/chimeraos.yml
  firmware: ./scripts/tasks/firmware.yml
  knulli: ./scripts/tasks/knulli.yml
  lakka: ./scripts/tasks/lakka.yml
  libreelec: ./scripts/tasks/libreelec.yml
  linux: ./scripts/tasks/linux.yml
  mac: ./scripts/tasks/mac.yml
  mister: ./scripts/tasks/mister.yml
  mistex: ./scripts/tasks/mistex.yml
  muos: ./scripts/tasks/muos.yml
  recalbox: ./scripts/tasks/recalbox.yml
  replayos: ./scripts/tasks/replayos.yml
  retropie: ./scripts/tasks/retropie.yml
  rocknix: ./scripts/tasks/rocknix.yml
  steamos: ./scripts/tasks/steamos.yml
  windows: ./scripts/tasks/windows.yml
  cross-lint: ./scripts/tasks/cross-lint.yml
  zigcc: ./scripts/tasks/zigcc.yml

tasks:
  build:
    vars:
      APP_BIN: '{{default "zaparoo" .APP_BIN}}'
      BUILD_OS: "{{default OS .BUILD_OS}}"
      BUILD_ARCH: "{{default ARCH .BUILD_ARCH}}"
      PLATFORM: '{{default (OS | replace "darwin" "mac") .PLATFORM}}'
      BUILD_DIR: "_build/{{.PLATFORM}}_{{.BUILD_ARCH}}"
      EXTRA_LDFLAGS: "{{.EXTRA_LDFLAGS}}"
      EXTRA_TAGS: "{{.EXTRA_TAGS}}"
    env:
      GO111MODULE: on
      CGO_ENABLED: 1
      GOARCH: "{{.BUILD_ARCH}}"
      GOOS: "{{.BUILD_OS}}"
      CGO_LDFLAGS: "{{if not .NO_LIBNFC}}-lnfc -lusb{{end}}"
      PLATFORM: "{{.PLATFORM}}"
      CC: "{{.CC}}"
      CXX: "{{.CXX}}"
    cmds:
      - task: expr:check-profile
      - task: credits:check
      - task: app:compress
      - >-
        go build -trimpath
        -ldflags "-X 'github.com/ZaparooProject/zaparoo-core/v2/pkg/config.AppVersion=${APP_VERSION}'
        -linkmode external -extldflags
        '{{if not .NO_LIBNFC}}${CGO_LDFLAGS}{{end}}
        {{if not .NO_STATIC}}-static{{end}}'
        -s -w {{.EXTRA_LDFLAGS}}"
        -tags "netgo,osusergo,sqlite_omit_load_extension,validator_novalidatefn,expr_static_methods{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}}"
        -o "{{.BUILD_DIR}}/{{.APP_BIN}}"
        "./cmd/${PLATFORM}"

  expr:check-profile:
    desc: Verify Expr method profile matches dependencies and Core environments
    env:
      GOOS: '{{OS}}'
      GOARCH: '{{ARCH}}'
      CGO_ENABLED: 0
    cmds:
      - go run ./scripts/expr-method-profile

  credits:
    desc: Regenerate the embedded contributor list and third-party software notices
    env:
      GOOS: '{{OS}}'
      GOARCH: '{{ARCH}}'
      CGO_ENABLED: 0
    cmds:
      - go run ./scripts/credits -check=false

  credits:check:
    desc: Verify the embedded third-party software notices match the dependencies
    env:
      GOOS: '{{OS}}'
      GOARCH: '{{ARCH}}'
      CGO_ENABLED: 0
    cmds:
      - go run ./scripts/credits

  app:compress:
    desc: Prepare compressed embedded app assets
    env:
      GOOS: '{{OS}}'
      GOARCH: '{{ARCH}}'
      CGO_ENABLED: 0
    cmds:
      - go run ./scripts/compress-app

  sim:build:
    desc: Build the zaparoo-sim development simulator (docs/sim.md)
    cmds:
      - >-
        go build
        -ldflags "-X 'github.com/ZaparooProject/zaparoo-core/v2/pkg/config.AppVersion=sim-{{.GIT_SHA}}'"
        -tags "sqlite_omit_load_extension,validator_novalidatefn,expr_static_methods"
        -o _build/sim/zaparoo-sim ./cmd/sim
    vars:
      GIT_SHA:
        sh: git rev-parse --short HEAD

  sim:run:
    desc: Build zaparoo-sim and serve it in the foreground from ROOT (default _build/sim/root)
    vars:
      ROOT: '{{default "_build/sim/root" .ROOT}}'
    cmds:
      - task: sim:build
      - _build/sim/zaparoo-sim --root "{{.ROOT}}" serve --foreground {{.CLI_ARGS}}

  clean:
    desc: Clean build artifacts (optionally specific platform/arch)
    vars:
      PLATFORM: '{{default "" .PLATFORM}}'
      ARCH: '{{default "" .ARCH}}'
      TARGET_DIR: "{{if and .PLATFORM .ARCH}}_build/{{.PLATFORM}}_{{.ARCH}}{{else if .PLATFORM}}_build/{{.PLATFORM}}_*{{else}}_build{{end}}"
    cmds:
      - '{{if eq OS "windows"}}powershell rm -Recurse -Force{{else}}rm -rf{{end}} {{.TARGET_DIR}}'

  hooks:install:
    desc: Install the pre-push hook, which runs task validate unless HEAD already passed it
    vars:
      HOOKS_DIR:
        sh: git rev-parse --git-path hooks
    cmds:
      - mkdir -p "{{.HOOKS_DIR}}"
      - |
        cat > "{{.HOOKS_DIR}}/pre-push" <<'HOOK'
        #!/usr/bin/env bash
        set -euo pipefail

        # task validate records the commit it passed. Git opens the connection
        # to the remote before this hook runs, so a long validation here can
        # outlast it; task push validates first and leaves nothing to do here.
        stamp="$(git rev-parse --git-path zaparoo-validated)"
        if [[ -f "$stamp" && "$(cat "$stamp")" == "$(git rev-parse HEAD)" ]]; then
          printf 'pre-push: HEAD already passed task validate\n'
          exit 0
        fi

        # Hooks are shared by every worktree, and a branch from before task
        # validate existed still needs its checks run.
        if ! task --summary validate >/dev/null 2>&1; then
          if [[ -n "$(git status --short)" ]]; then
            printf 'pre-push: working tree has uncommitted changes; commit them first\n' >&2
            git status --short >&2
            exit 1
          fi
          printf 'pre-push: this branch has no task validate; running the older checks\n'
          task lint-fix
          task test
          task cross-lint:all
          if [[ -n "$(git status --short)" ]]; then
            printf 'pre-push: validation changed files; review and commit them\n' >&2
            git status --short >&2
            exit 1
          fi
          exit 0
        fi

        printf 'pre-push: running task validate (use task push to validate before connecting)\n'
        exec task validate
        HOOK
      - chmod +x "{{.HOOKS_DIR}}/pre-push"
      - echo "Installed {{.HOOKS_DIR}}/pre-push"

  validate:
    desc: Run the pre-push checks (lint-fix, then tests and cross-lint at once) and record HEAD as validated
    vars:
      STAMP:
        sh: git rev-parse --git-path zaparoo-validated
      # Read once when the task starts, so a commit that appears while the
      # checks run is never recorded as validated.
      START_HEAD:
        sh: git rev-parse HEAD
    cmds:
      - task: validate:clean-tree
        vars:
          WHEN: before validation
      - task: lint-fix
      - task: validate:clean-tree
        vars:
          WHEN: after lint-fix
      - task --output=prefixed validate:checks
      - task: validate:clean-tree
        vars:
          WHEN: after the checks
      - |
        if [ "$(git rev-parse HEAD)" != "{{.START_HEAD}}" ]; then
          echo "validate: HEAD moved from {{.START_HEAD}} while the checks ran; run task validate again" >&2
          exit 1
        fi
        echo "{{.START_HEAD}}" > "{{.STAMP}}"
        echo "validate: {{.START_HEAD}} passed"

  validate:checks:
    # No desc, so it stays out of task --list: run it through task validate.
    deps:
      - test
      - cross-lint:check:windows
      - cross-lint:check:mac

  validate:clean-tree:
    internal: true
    cmds:
      - |
        if [ -n "$(git status --porcelain)" ]; then
          echo "validate: the working tree has uncommitted changes {{.WHEN}}." >&2
          echo "Review and commit them, then run it again." >&2
          git status --short >&2
          exit 1
        fi

  push:
    desc: Run task validate, then git push with any arguments after --
    cmds:
      - task: validate
      - git push {{.CLI_ARGS}}

  test:c-sanitizer-canary:
    desc: Verify the C compiler flags make undefined behavior fail the job
    cmds:
      - |
        set -eu
        : "${CC:?C compiler required}" "${CGO_CFLAGS:?Sanitizer flags required}"
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        $CC $CGO_CFLAGS scripts/testing/c-sanitizer-canary.c -o "$work/probe"
        if "$work/probe" >"$work/result" 2>&1; then
          echo 'C sanitizer canary unexpectedly succeeded' >&2
          exit 1
        fi
        if ! grep -q 'signed integer overflow' "$work/result"; then
          cat "$work/result" >&2
          exit 1
        fi
        echo 'C sanitizer canary correctly rejected signed integer overflow'

  test:native-sanitized:
    desc: Verify instrumented native archives and exercise hardware-free C APIs
    cmds:
      - |
        set -eu
        : "${CC:?C compiler required}" "${CGO_CFLAGS:?Sanitizer flags required}"
        : "${CGO_LDFLAGS:?Native archive paths required}"
        for archive in /opt/deps/x86_64-linux-gnu/lib/libusb.a /opt/deps/x86_64-linux-gnu/lib/libusb-1.0.a /opt/libnfc/x86_64-linux-gnu/lib/libnfc.a; do
          if ! nm -u "$archive" | grep -q '__ubsan_handle_'; then
            echo "Native archive lacks UBSan instrumentation: $archive" >&2
            exit 1
          fi
        done
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        $CC $CGO_CFLAGS -I/opt/deps/x86_64-linux-gnu/include -I/opt/deps/x86_64-linux-gnu/include/libusb-1.0 \
          scripts/testing/native-library-smoke.c $CGO_LDFLAGS -lpthread -o "$work/smoke"
        "$work/smoke"

  test:linux-release:
    desc: Test Core packages reachable from the Linux release entry point
    vars:
      RELEASE_TAGS: netgo,osusergo,sqlite_omit_load_extension,validator_novalidatefn,expr_static_methods,nopkgconfig
    preconditions:
      - sh: test '{{OS}}' = linux
        msg: Linux release tests must run in a Linux environment.
    cmds:
      - task: expr:check-profile
      # The release image lacks PC/SC development files. Test the shipping
      # graph rather than unrelated reader packages excluded by nopkgconfig.
      # This runs under the C undefined-behavior checks, which do not need
      # the race detector; the main test job already race-tests this code,
      # and -race made this the slowest job in the run.
      - |
        set -eu
        deps=$(go list -deps -tags={{.RELEASE_TAGS}} ./cmd/linux)
        packages=$(printf '%s\n' "$deps" | grep '^github.com/ZaparooProject/zaparoo-core/v2/')
        go test -count=1 -tags={{.RELEASE_TAGS}} $packages

  test:
    desc: Run all tests
    vars:
      TEST_ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - task: expr:check-profile
      - task: credits:check
      - go test -race -vet=off -tags=validator_novalidatefn,expr_static_methods {{.TEST_ARGS}}
      - |
        if [ '{{.TEST_ARGS}}' = './...' ]; then
          (cd mister && go test -race -vet=off ./...)
        fi

  fuzz:
    desc: Run fuzz tests (default 30s per test, use FUZZ_TIME to override)
    vars:
      FUZZ_TIME: '{{default "30s" .FUZZ_TIME}}'
    cmds:
      - |
        exit_code=0
        targets=()
        while IFS= read -r pkg; do
          if ! listing="$(go test -tags=validator_novalidatefn,expr_static_methods -list '^Fuzz' "./${pkg}")"; then
            echo "FAIL: listing fuzz targets in ${pkg}"
            exit_code=1
            continue
          fi
          found=0
          while IFS= read -r func; do
            targets+=("${func} ${pkg}")
            found=$((found + 1))
          done < <(grep '^Fuzz' <<< "${listing}" || true)
          if [ "${found}" -eq 0 ]; then
            echo "FAIL: no fuzz targets listed in ${pkg}"
            exit_code=1
          fi
        done < <(grep -rl --include='*_test.go' '^func Fuzz' pkg | xargs -n1 dirname | sort -u)
        if [ "${#targets[@]}" -eq 0 ]; then
          echo "FAIL: no fuzz targets discovered"
          exit 1
        fi
        for target in "${targets[@]}"; do
          func="${target%% *}"
          pkg="${target#* }"
          echo "=== ${func} (${pkg}) ==="
          if go test -tags=validator_novalidatefn,expr_static_methods -run "^$" -fuzz="${func}" -fuzztime={{.FUZZ_TIME}} "./${pkg}"; then
            echo "PASS: ${func}"
          else
            echo "FAIL: ${func} in ${pkg}"
            exit_code=1
          fi
        done
        exit $exit_code

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...
      - cd mister && golangci-lint run ./...

  lint-fix:
    desc: Run golangci-lint with auto-fixes
    cmds:
      - golangci-lint run --fix ./...
      - cd mister && golangci-lint run --fix ./...

  vulncheck:
    desc: Run govulncheck for security vulnerabilities
    cmds:
      - govulncheck ./...

  nilcheck:
    desc: Run nilaway for nil-pointer analysis
    cmds:
      # Run through go vet so each package is analysed in its own process.
      # Standalone nilaway loads the whole dependency graph into one process
      # and needs well over 10 GB for this repo.
      - >-
        go vet -p 4 -vettool="$(command -v nilaway)"
        -include-pkgs=github.com/ZaparooProject/zaparoo-core ./...

  deadlock:
    desc: Run tests with go-deadlock to detect lock ordering violations
    cmds:
      - go test -tags=deadlock,validator_novalidatefn,expr_static_methods -race -count=1 ./...

  mutesting:
    desc: Run mutation testing on a package
    cmds:
      - go-mutesting {{.CLI_ARGS}}

  # Benchmark workflow:
  #   1. task bench-baseline  (generates testdata/benchmarks/baseline.txt, commit this)
  #   2. make changes
  #   3. task bench-compare   (compares current vs committed baseline via benchstat)
  # Quick runs: task bench (count=3) or task bench-db (database only)
  bench:
    desc: Run all benchmarks
    cmds:
      - go test -run='^$' -bench=. -benchmem -count=3 -timeout=30m ./...

  bench-db:
    desc: Run database benchmarks only
    cmds:
      - go test -run='^$' -bench=. -benchmem -count=3 -timeout=20m ./pkg/database/...

  bench-baseline:
    desc: Generate benchmark baseline (commit the output)
    cmds:
      - bash -o pipefail -c 'go test -run="^$$" -bench=. -benchmem -count=6 -timeout=45m ./... | grep -E "^(Benchmark|goos:|goarch:|pkg:|cpu:)" | tee testdata/benchmarks/baseline.txt'

  bench-compare:
    desc: Compare current benchmarks against baseline (requires benchstat, install with go install golang.org/x/perf/cmd/benchstat@latest)
    vars:
      BENCH_PKGS: '{{default "./..." .BENCH_PKGS}}'
      BENCH_PATTERN: '{{default "." .BENCH_PATTERN}}'
    cmds:
      - bash -o pipefail -c 'go test -run="^$$" -bench="{{.BENCH_PATTERN}}" -benchmem -count=6 -timeout=45m {{.BENCH_PKGS}} | grep -E "^(Benchmark|goos:|goarch:|pkg:|cpu:)" > /tmp/zaparoo-bench-current.txt'
      - benchstat testdata/benchmarks/baseline.txt /tmp/zaparoo-bench-current.txt

  get-logs:
    desc: Download and decode logs from Zaparoo API
    vars:
      ENDPOINT: '{{default "localhost:7497" .CLI_ARGS}}'
      UUID:
        sh: uuidgen
    cmds:
      - >-
        curl -X POST http://{{.ENDPOINT}}/api/v0.1
        -H "Content-Type: application/json"
        -d '{
          "jsonrpc": "2.0",
          "method": "settings.logs.download",
          "params": {},
          "id": "{{.UUID}}"
        }' | jq -r '.result.content' | base64 -d
