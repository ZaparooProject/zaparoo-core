name: Go CI setup
description: Set up Go, its module and build caches, and the native libraries the Lint and Test jobs need.

inputs:
  os:
    description: "Runner OS from the job matrix: ubuntu, macos or windows"
    required: true
  build-cache:
    description: >-
      Restore the Go build cache: "true" or "false". Linux and Windows only;
      a macOS cache would not fit the repository's Actions quota.
    required: false
    default: "false"
  save-build-cache:
    description: >-
      Also save the Go build cache when the job ends, on main only. Only the
      test job should: one entry is kept per day, so the first job to finish
      wins it, and a lint job's cache would leave the next test run compiling
      cold.
    required: false
    default: "false"

outputs:
  gomod-cache-hit:
    description: Whether the module cache was restored from an exact key match
    value: ${{ steps.restore-unix.outputs.cache-hit || steps.restore-windows.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Configure Go paths for Windows
      if: inputs.os == 'windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "D:\go-cache" | Out-Null
        New-Item -ItemType Directory -Force -Path "D:\go-mod-cache" | Out-Null
        New-Item -ItemType Directory -Force -Path "D:\go-tmp" | Out-Null
        Add-Content -Path $env:GITHUB_ENV -Value "GOCACHE=D:\go-cache"
        Add-Content -Path $env:GITHUB_ENV -Value "GOMODCACHE=D:\go-mod-cache"
        Add-Content -Path $env:GITHUB_ENV -Value "GOTMPDIR=D:\go-tmp"

    - name: Set up MSYS2 (Windows)
      if: inputs.os == 'windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: pkgconf
        path-type: inherit

    - name: Restore Go module cache (Unix)
      id: restore-unix
      if: inputs.os != 'windows'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    - name: Restore Go module cache (Windows)
      id: restore-windows
      if: inputs.os == 'windows'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: D:\go-mod-cache
        key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    # Without a build cache every run compiled the module from scratch: cgo
    # plus a -race test binary per package. Pull requests restore the newest
    # cache main saved; main saves one a day, since a save per commit cost
    # Windows over six minutes and pushed out every other cache.
    #
    # The cache also holds test results. Go reuses one only when the files the
    # test read have the size and modification time it recorded, so the
    # checkout's times are replaced with times derived from each file's git
    # hash, and a package whose inputs did not change reports (cached).
    #
    # Go's cache does not see C and C++ files that a package pulls in by
    # #include from another directory, which is how the vendored audio
    # libraries under pkg/**/third_party are built. A restored cache would
    # keep linking objects compiled from the old sources, so the key and every
    # restore key carry a hash of those sources and a change starts cold.
    - name: Compute Go build cache key
      id: build-cache-key
      if: inputs.build-cache == 'true' && inputs.os != 'macos'
      shell: bash
      env:
        PREFIX: ${{ runner.os }}-gobuild-${{ hashFiles('pkg/**/third_party/**') }}-${{ hashFiles('go.mod', 'go.sum') }}-
      run: |
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        echo "key=$PREFIX$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_OS" = Windows ]; then
          echo "path=D:\go-cache" >> "$GITHUB_OUTPUT"
        else
          echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache Go build cache
      if: steps.build-cache-key.outputs.key && inputs.save-build-cache == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.build-cache-key.outputs.path }}
        key: ${{ steps.build-cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.build-cache-key.outputs.prefix }}
          ${{ runner.os }}-gobuild-${{ hashFiles('pkg/**/third_party/**') }}-

    - name: Restore Go build cache
      if: steps.build-cache-key.outputs.key && (inputs.save-build-cache != 'true' || github.ref != 'refs/heads/main')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.build-cache-key.outputs.path }}
        key: ${{ steps.build-cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.build-cache-key.outputs.prefix }}
          ${{ runner.os }}-gobuild-${{ hashFiles('pkg/**/third_party/**') }}-

    - name: Set file times from git
      if: steps.build-cache-key.outputs.key
      shell: bash
      run: |
        if command -v python3 >/dev/null; then py=python3; else py=python; fi
        "$py" -I .github/scripts/set-mtimes-from-git.py

    - name: Download Go modules
      shell: bash
      run: go mod download

    # These two are the only native libraries a Linux build needs: libnfc for
    # the clausecker/nfc binding and libpcsclite for the scard binding. They
    # pull six packages between them, so installing them outright is as quick
    # as restoring a cache and cannot go stale. dbus provides the dbus-daemon
    # the Bluetooth LE integration tests run a private bus on.
    - name: Install system dependencies (Ubuntu)
      if: inputs.os == 'ubuntu'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          dbus \
          libnfc-dev \
          libpcsclite-dev
