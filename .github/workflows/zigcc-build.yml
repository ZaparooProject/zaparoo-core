name: Build zigcc Docker image

on:
  push:
    paths:
      - 'scripts/zigcc/**'
      - 'scripts/tasks/zigcc.yml'
      - '.github/workflows/zigcc-build.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.1)'
        required: true
        type: string
  workflow_call:
    outputs:
      version:
        description: 'The zigcc image version that was built or verified'
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version
        id: version
        # Read the input rather than the event: when build.yml is dispatched and
        # calls this workflow, the event is workflow_dispatch but has no version.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(cat scripts/zigcc/VERSION)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building zigcc version: $VERSION"

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version exists
        id: check
        run: |
          if docker manifest inspect ghcr.io/${{ env.OWNER_LC }}/zigcc:${{ steps.version.outputs.version }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.version.outputs.version }} already exists in registry"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.version.outputs.version }} will be built"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/zigcc
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/zigcc:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.OWNER_LC }}/zigcc:latest
          build-args: |
            UID=1001
            GID=1001
          cache-from: type=gha,scope=zigcc-build
          cache-to: type=gha,mode=max,scope=zigcc-build

      # The Linux C sanitizers job rebuilds libusb and libnfc with UBSan from
      # this toolchain unless it can pull them. Publish them for this
      # scripts/zigcc tree; the job still rebuilds when the image's label shows
      # a different toolchain or different flags.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.44.1

      - name: Build and push sanitized native libraries
        run: |
          image="ghcr.io/${OWNER_LC}/zigcc:sanitized-$(git rev-parse HEAD:scripts/zigcc)"
          docker pull "ghcr.io/${OWNER_LC}/zigcc:${VERSION}"
          docker tag "ghcr.io/${OWNER_LC}/zigcc:${VERSION}" zaparoo/zigcc
          # The tag covers only scripts/zigcc. The task rebuilds when the
          # published image's label shows other flags or another toolchain, and
          # the new image replaces it.
          before=""
          if docker pull "$image"; then
            docker tag "$image" zaparoo/zigcc-sanitized
            before="$(docker image inspect --format '{{.Id}}' zaparoo/zigcc-sanitized)"
          fi
          task linux:sanitized-image-amd64
          after="$(docker image inspect --format '{{.Id}}' zaparoo/zigcc-sanitized)"
          if [ "$before" = "$after" ]; then
            echo "$image is up to date"
            exit 0
          fi
          docker tag zaparoo/zigcc-sanitized "$image"
          docker push "$image"
        env:
          VERSION: ${{ steps.version.outputs.version }}
