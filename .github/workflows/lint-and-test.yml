name: Lint and Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: read
  security-events: write

env:
  # Pinned so CI, cross-lint and the pre-push hook all agree on one version.
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  ci:
    name: CI
    # Windows takes 12 to 13 minutes here even with its Go build cache warm, so
    # a 15 minute cap left almost no headroom: once that cache was evicted the
    # job compiled from scratch, hit the limit while still linking, and died
    # before the post step that saves a new one. That made the timeout
    # self-sustaining, because every following run also started cold. 30 gives a
    # cold run room to finish and repopulate the cache.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{
            github.event_name == 'pull_request'
              && fromJSON('[{"os":"ubuntu","runner":"ubicloud-standard-4"}]')
              || fromJSON('[
                   {"os":"ubuntu","runner":"ubicloud-standard-4"},
                   {"os":"macos","runner":"macos-latest"},
                   {"os":"windows","runner":"windows-latest"}
                 ]')
          }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Go paths for Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\go-cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\go-mod-cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\go-tmp" | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "GOCACHE=D:\go-cache"
          Add-Content -Path $env:GITHUB_ENV -Value "GOMODCACHE=D:\go-mod-cache"
          Add-Content -Path $env:GITHUB_ENV -Value "GOTMPDIR=D:\go-tmp"

      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: pkgconf
          path-type: inherit

      - name: Restore Go cache (Unix)
        id: restore-go-cache-unix
        if: matrix.os != 'windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-

      - name: Restore Go cache (Windows)
        id: restore-go-cache-windows
        if: matrix.os == 'windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\go-mod-cache
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-

      # Only the module cache is persisted, so every Windows run compiled the
      # module from scratch: cgo plus a -race test binary per package, at
      # GOMAXPROCS 2. That put the first test result seven minutes in and left
      # the job still linking when the timeout killed it. This cache is keyed by
      # commit and restored by prefix, so a run starts from the nearest previous
      # build rather than from nothing.
      - name: Cache Go build cache (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\go-cache
          key: ${{ runner.os }}-gobuild-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gobuild-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-gobuild-

      - name: Download Go modules (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: go mod download

      - name: Download Go modules (non-Windows)
        if: matrix.os != 'windows'
        run: go mod download

      # These two are the only native libraries a Linux build needs: libnfc for
      # the clausecker/nfc binding and libpcsclite for the scard binding. They
      # pull six packages between them, so installing them outright is as quick
      # as restoring a cache and cannot go stale.
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libnfc-dev \
            libpcsclite-dev

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Install govulncheck
        if: matrix.os == 'ubuntu'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (SARIF)
        if: matrix.os == 'ubuntu'
        run: govulncheck -format sarif -o govulncheck.sarif ./...
        continue-on-error: true

      - name: Run govulncheck (CI gate)
        if: matrix.os == 'ubuntu'
        run: |
          set +e
          report="$(mktemp)"
          govulncheck -format json ./... | tee "$report"
          status=${PIPESTATUS[0]}
          set -e

          unexpected="$(jq -s '[.[] | select(type == "object" and has("finding")) | .finding.osv | select(. != "GO-2026-5932")] | unique' "$report")"
          known="$(jq -s '[.[] | select(type == "object" and has("finding")) | .finding.osv | select(. == "GO-2026-5932")] | length > 0' "$report")"
          rm "$report"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$known" = "true" ] && [ "$unexpected" = "[]" ]; then
            echo "Accepted GO-2026-5932: go-selfupdate requires unmaintained OpenPGP; no upstream fix exists."
            exit 0
          fi

          echo "Unexpected govulncheck findings: $unexpected" >&2
          exit "$status"

      - name: Upload govulncheck SARIF
        if: matrix.os == 'ubuntu' && !cancelled() && github.event_name != 'workflow_call' && hashFiles('govulncheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

      - name: Run full tests (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        env:
          GOMAXPROCS: 2
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run full tests (Unix)
        if: matrix.os != 'windows'
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload rapid failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapid-failures-${{ matrix.os }}
          path: '**/testdata/rapid/**/*.fail'
          if-no-files-found: ignore

      - name: Run deadlock detection tests
        if: matrix.os == 'ubuntu'
        run: go test -tags=deadlock -race -count=1 ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu' && !startsWith(github.ref, 'refs/tags/')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Save Go cache (Unix)
        if: matrix.os != 'windows' && steps.restore-go-cache-unix.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Save Go cache (Windows)
        if: matrix.os == 'windows' && steps.restore-go-cache-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\go-mod-cache
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}

  mister-backup-mount-smoke:
    name: MiSTer Backup Mount Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libnfc-dev \
            libpcsclite-dev

      - name: Verify runner prerequisites
        run: |
          command -v unshare
          sudo -n true

      - name: Run MiSTer backup mount smoke test
        run: scripts/test-mister-backup-mounts.sh

  cross-lint:
    name: Cross Lint
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [windows, darwin]
        runner: [ubicloud-standard-4]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image reference
        run: |
          OWNER_LC="${OWNER,,}"
          VERSION=$(cat scripts/zigcc/VERSION)
          echo "ZIGCC_IMAGE=ghcr.io/${OWNER_LC}/zigcc:${VERSION}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set cross-compilation environment
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            {
              echo "TARGET_CC=zig cc -w --target=x86_64-windows-gnu"
              echo "TARGET_CXX=zig c++ -w --target=x86_64-windows-gnu"
              echo "TARGET_CGO_CFLAGS="
              echo "TARGET_CGO_LDFLAGS=-Wl,--subsystem,windows"
            } >> "$GITHUB_ENV"
          elif [ "${{ matrix.target }}" = "darwin" ]; then
            {
              echo "TARGET_CC=zig cc -w --target=x86_64-macos -I/opt/macosx-sdk/usr/include -L/opt/macosx-sdk/usr/lib -F/opt/macosx-sdk/System/Library/Frameworks"
              echo "TARGET_CXX=zig c++ -w --target=x86_64-macos -I/opt/macosx-sdk/usr/include -L/opt/macosx-sdk/usr/lib -F/opt/macosx-sdk/System/Library/Frameworks"
              echo "TARGET_CGO_CFLAGS="
              echo "TARGET_CGO_LDFLAGS="
            } >> "$GITHUB_ENV"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build zigcc image
        run: |
          if ! docker pull "${{ env.ZIGCC_IMAGE }}" 2>/dev/null; then
            echo "Image not in registry, building locally..."
            docker build --build-arg UID=1001 --build-arg GID=1001 \
              -t "${{ env.ZIGCC_IMAGE }}" scripts/zigcc
          fi

      - name: Cross-platform lint (${{ matrix.target }})
        run: |
          docker run --rm \
            -v "${PWD}:/build" \
            -e GOOS=${{ matrix.target }} \
            -e GOARCH=amd64 \
            -e CGO_ENABLED=1 \
            -e CC="${TARGET_CC}" \
            -e CXX="${TARGET_CXX}" \
            -e CGO_CFLAGS="${TARGET_CGO_CFLAGS}" \
            -e CGO_LDFLAGS="${TARGET_CGO_LDFLAGS}" \
            -e GOLANGCI_LINT_VERSION \
            ${{ env.ZIGCC_IMAGE }} \
            bash -c 'curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b /home/build/bin "$GOLANGCI_LINT_VERSION" 2>&1 | tail -1 && PATH="/home/build/bin:$PATH" golangci-lint run --timeout=5m'

  native-pr-tests:
    name: Native PR Tests
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Go paths for Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\go-cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\go-mod-cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\go-tmp" | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "GOCACHE=D:\go-cache"
          Add-Content -Path $env:GITHUB_ENV -Value "GOMODCACHE=D:\go-mod-cache"
          Add-Content -Path $env:GITHUB_ENV -Value "GOTMPDIR=D:\go-tmp"

      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: pkgconf
          path-type: inherit

      - name: Restore Go cache (macOS)
        if: matrix.os == 'macos'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-

      - name: Restore Go cache (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\go-mod-cache
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-

      - name: Download Go modules (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: go mod download

      - name: Download Go modules (non-Windows)
        if: matrix.os != 'windows'
        run: go mod download

      - name: Run native tests (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        env:
          GOMAXPROCS: 2
        run: |
          go test -v -race \
            ./pkg/api \
            ./pkg/database/mediascanner \
            ./pkg/helpers \
            ./pkg/helpers/command \
            ./pkg/readers/externaldrive \
            ./pkg/platforms/shared/steam \
            ./pkg/platforms/shared/steam/steamtracker \
            ./pkg/service \
            ./pkg/service/backup \
            ./pkg/service/restart \
            ./pkg/ui/systray

      - name: Run native tests (macOS)
        if: matrix.os == 'macos'
        run: |
          go test -v -race \
            ./pkg/api \
            ./pkg/database/mediascanner \
            ./pkg/helpers \
            ./pkg/helpers/command \
            ./pkg/readers/externaldrive \
            ./pkg/platforms/shared/steam \
            ./pkg/platforms/shared/steam/steamtracker \
            ./pkg/service \
            ./pkg/service/backup \
            ./pkg/service/daemon \
            ./pkg/service/restart \
            ./pkg/ui/systray

      - name: Upload rapid failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapid-failures-native-${{ matrix.os }}
          path: '**/testdata/rapid/**/*.fail'
          if-no-files-found: ignore

  ci-status:
    name: CI Status
    if: always() && !cancelled()
    needs: [actionlint, ci, cross-lint, native-pr-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          if [ "${{ needs.actionlint.result }}" != "success" ]; then
            echo "CI failed: actionlint=${{ needs.actionlint.result }}"
            exit 1
          fi
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed: ci=${{ needs.ci.result }}"
            exit 1
          fi
          CROSS_RESULT="${{ needs.cross-lint.result }}"
          if [ "$CROSS_RESULT" != "success" ] && [ "$CROSS_RESULT" != "skipped" ]; then
            echo "CI failed: cross-lint=$CROSS_RESULT"
            exit 1
          fi
          NATIVE_RESULT="${{ needs.native-pr-tests.result }}"
          if [ "$NATIVE_RESULT" != "success" ] && [ "$NATIVE_RESULT" != "skipped" ]; then
            echo "CI failed: native-pr-tests=$NATIVE_RESULT"
            exit 1
          fi
          echo "CI passed"
