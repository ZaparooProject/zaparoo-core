name: Lint and Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      release_gate:
        description: "Run as a release build's test gate: the reports below belong to branches, not releases, so skip them"
        required: false
        type: boolean
        default: false

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: read
  security-events: write

env:
  # Pinned so CI, cross-lint and the pre-push hook all agree on one version.
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  c-sanitizers:
    name: Linux C sanitizers
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.44.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Native archives are rebuilt from this checkout. Pull the toolchain
      # version Cross Lint uses; a PR that bumps VERSION before the image is
      # published builds it locally instead.
      - name: Pull release toolchain
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/zigcc:$(cat scripts/zigcc/VERSION)"
          if docker pull "$image"; then
            docker tag "$image" zaparoo/zigcc
          else
            echo "Could not pull $image, building it locally..."
            docker build --build-arg UID=1001 --build-arg GID=1001 -t zaparoo/zigcc scripts/zigcc
          fi
      - name: Build sanitized native libraries and run release tests
        run: task linux:test-sanitized-amd64

  lint:
    name: Lint
    # Lint, the full tests and the deadlock tests each take minutes on their
    # own, so they run as parallel jobs rather than one after another.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{
            github.event_name == 'pull_request'
              && fromJSON('[{"os":"ubuntu","runner":"ubicloud-standard-4"}]')
              || fromJSON('[
                   {"os":"ubuntu","runner":"ubuntu-latest"},
                   {"os":"macos","runner":"macos-latest"},
                   {"os":"windows","runner":"windows-latest"}
                 ]')
          }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go and dependencies
        uses: ./.github/actions/go-ci-setup
        with:
          os: ${{ matrix.os }}

      # The vendored C and C++ audio decoders are compiled by cgo before the
      # analysis starts, which takes macOS over five minutes on its own.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=12m

      - name: Install govulncheck
        if: matrix.os == 'ubuntu'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (SARIF)
        if: matrix.os == 'ubuntu'
        # govulncheck has no output-file flag; the report goes to stdout. Write it
        # aside first so a failed scan leaves no partial file for the upload.
        run: govulncheck -format sarif ./... > govulncheck.sarif.tmp && mv govulncheck.sarif.tmp govulncheck.sarif
        continue-on-error: true

      - name: Run govulncheck (CI gate)
        if: matrix.os == 'ubuntu'
        run: |
          set +e
          report="$(mktemp)"
          govulncheck -format json ./... | tee "$report"
          status=${PIPESTATUS[0]}
          set -e

          unexpected="$(jq -s '[.[] | select(type == "object" and has("finding")) | .finding.osv | select(. != "GO-2026-5932")] | unique' "$report")"
          known="$(jq -s '[.[] | select(type == "object" and has("finding")) | .finding.osv | select(. == "GO-2026-5932")] | length > 0' "$report")"
          rm "$report"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$known" = "true" ] && [ "$unexpected" = "[]" ]; then
            echo "Accepted GO-2026-5932: go-selfupdate requires unmaintained OpenPGP; no upstream fix exists."
            exit 0
          fi

          echo "Unexpected govulncheck findings: $unexpected" >&2
          exit "$status"

      - name: Upload govulncheck SARIF
        # Not on a release gate: code scanning rejects an upload for a tag ref,
        # which would fail the job and block the release over a report nobody
        # asked this run for. github.event_name cannot express this — inside a
        # reusable workflow it still reads as the caller's event.
        if: matrix.os == 'ubuntu' && !cancelled() && !inputs.release_gate && hashFiles('govulncheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

      - name: Verify Expr method profile
        if: matrix.os == 'ubuntu'
        run: |
          go run ./scripts/expr-method-profile
          go test -race -tags=expr_static_methods github.com/expr-lang/expr/internal/staticmethod github.com/ZaparooProject/go-zapscript/...

  ci:
    name: CI
    # Windows takes 12 to 13 minutes here even with its Go build cache warm, so
    # a 15 minute cap left almost no headroom: once that cache was evicted the
    # job compiled from scratch, hit the limit while still linking, and died
    # before the post step that saves a new one. That made the timeout
    # self-sustaining, because every following run also started cold. 30 gives a
    # cold run room to finish and repopulate the cache.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Pay for fast PR feedback, not post-merge validation. Non-PR runs use
      # GitHub-hosted runners, which also preserve SignPath's requirement that
      # every job upstream of a signed release artifact use that runner group.
      matrix:
        include: >-
          ${{
            github.event_name == 'pull_request'
              && fromJSON('[{"os":"ubuntu","runner":"ubicloud-standard-4"}]')
              || fromJSON('[
                   {"os":"ubuntu","runner":"ubuntu-latest"},
                   {"os":"macos","runner":"macos-latest"},
                   {"os":"windows","runner":"windows-latest"}
                 ]')
          }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go and dependencies
        id: setup
        uses: ./.github/actions/go-ci-setup
        with:
          os: ${{ matrix.os }}
          save-build-cache: "true"

      # Without -v, go test prints only the output of failing tests. With it,
      # every passing test's log output went to the job log, which grew past
      # what the GitHub log viewer will open.
      - name: Run full tests (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        env:
          GOMAXPROCS: 2
        run: |
          set -o pipefail
          go test -race -tags=validator_novalidatefn,expr_static_methods -coverprofile=coverage.txt -covermode=atomic ./... 2>&1 | tee go-test-output.txt

      - name: Run full tests (Unix)
        if: matrix.os != 'windows'
        run: |
          set -o pipefail
          go test -race -tags=validator_novalidatefn,expr_static_methods -coverprofile=coverage.txt -covermode=atomic ./... 2>&1 | tee go-test-output.txt

      - name: Summarize test failures
        if: failure()
        shell: bash
        run: .github/scripts/go-test-summary.sh go-test-output.txt "Full tests (${{ matrix.os }})"

      - name: Upload rapid failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapid-failures-${{ matrix.os }}
          path: '**/testdata/rapid/**/*.fail'
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        # Coverage is tracked per branch, so a release gate's run has nothing to
        # report against.
        #
        # Codecov is a reporting service, not a gate: an outage on its side
        # does not fail the job. The next step reports it as a warning.
        id: codecov
        if: matrix.os == 'ubuntu' && !inputs.release_gate
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Warn when the coverage upload failed
        if: steps.codecov.outcome == 'failure'
        run: echo "::warning title=Coverage not uploaded::The Codecov upload failed, so this run has no coverage report."

      - name: Save Go module cache (Unix)
        if: matrix.os != 'windows' && steps.setup.outputs.gomod-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Save Go module cache (Windows)
        if: matrix.os == 'windows' && steps.setup.outputs.gomod-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\go-mod-cache
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}

  deadlock:
    name: Deadlock Detection
    timeout-minutes: 30
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-4' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go and dependencies
        uses: ./.github/actions/go-ci-setup
        with:
          os: ubuntu

      - name: Run deadlock detection tests
        run: |
          set -o pipefail
          go test -tags=deadlock,validator_novalidatefn,expr_static_methods -race -count=1 ./... 2>&1 | tee go-test-output.txt

      - name: Summarize test failures
        if: failure()
        run: .github/scripts/go-test-summary.sh go-test-output.txt "Deadlock detection tests"

  mister-backup-mount-smoke:
    name: MiSTer Backup Mount Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libnfc-dev \
            libpcsclite-dev

      - name: Verify runner prerequisites
        run: |
          command -v unshare
          sudo -n true

      - name: Run MiSTer backup mount smoke test
        run: scripts/test-mister-backup-mounts.sh

  cross-lint:
    name: Cross Lint
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [windows, darwin]
        runner: [ubicloud-standard-4]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image reference
        run: |
          OWNER_LC="${OWNER,,}"
          VERSION=$(cat scripts/zigcc/VERSION)
          echo "ZIGCC_IMAGE=ghcr.io/${OWNER_LC}/zigcc:${VERSION}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set cross-compilation environment
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            {
              echo "TARGET_CC=zig cc -w --target=x86_64-windows-gnu"
              echo "TARGET_CXX=zig c++ -w --target=x86_64-windows-gnu"
              echo "TARGET_CGO_CFLAGS="
              echo "TARGET_CGO_LDFLAGS=-Wl,--subsystem,windows"
            } >> "$GITHUB_ENV"
          elif [ "${{ matrix.target }}" = "darwin" ]; then
            {
              echo "TARGET_CC=zig cc -w --target=x86_64-macos -I/opt/macosx-sdk/usr/include -L/opt/macosx-sdk/usr/lib -F/opt/macosx-sdk/System/Library/Frameworks"
              echo "TARGET_CXX=zig c++ -w --target=x86_64-macos -idirafter /opt/macosx-sdk/usr/include -L/opt/macosx-sdk/usr/lib -F/opt/macosx-sdk/System/Library/Frameworks"
              echo "TARGET_CGO_CFLAGS="
              echo "TARGET_CGO_LDFLAGS="
            } >> "$GITHUB_ENV"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build zigcc image
        run: |
          if ! docker pull "${{ env.ZIGCC_IMAGE }}" 2>/dev/null; then
            echo "Image not in registry, building locally..."
            docker build --build-arg UID=1001 --build-arg GID=1001 \
              -t "${{ env.ZIGCC_IMAGE }}" scripts/zigcc
          fi

      # go.mod can require a newer Go than the zigcc image ships. The container
      # then downloads the full toolchain (about 75 MB) before every go command,
      # and a stalled download hangs go list inside golangci-lint past its own
      # --timeout. Use the runner's setup-go toolchain inside the container
      # instead, so nothing is downloaded from the module proxy.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch modules
        run: |
          mkdir -p "${RUNNER_TEMP}/gomod"
          chmod 777 "${RUNNER_TEMP}/gomod"
          for attempt in 1 2; do
            docker rm -f go-fetch >/dev/null 2>&1 || true
            if timeout 300 docker run --rm --name go-fetch \
              -v "${PWD}:/build" \
              -v "$(go env GOROOT):/usr/local/go:ro" \
              -v "${RUNNER_TEMP}/gomod:/home/build/go" \
              -e GOTOOLCHAIN=local \
              ${{ env.ZIGCC_IMAGE }} go mod download; then
              exit 0
            fi
            echo "Module fetch attempt ${attempt} failed or timed out"
          done
          docker rm -f go-fetch >/dev/null 2>&1 || true
          exit 1

      - name: Cross-platform lint (${{ matrix.target }})
        run: |
          docker run --rm \
            -v "${PWD}:/build" \
            -v "$(go env GOROOT):/usr/local/go:ro" \
            -v "${RUNNER_TEMP}/gomod:/home/build/go" \
            -e GOTOOLCHAIN=local \
            -e GOOS=${{ matrix.target }} \
            -e GOARCH=amd64 \
            -e CGO_ENABLED=1 \
            -e CC="${TARGET_CC}" \
            -e CXX="${TARGET_CXX}" \
            -e CGO_CFLAGS="${TARGET_CGO_CFLAGS}" \
            -e CGO_LDFLAGS="${TARGET_CGO_LDFLAGS}" \
            -e GOLANGCI_LINT_VERSION \
            ${{ env.ZIGCC_IMAGE }} \
            bash -c 'curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b /home/build/bin "$GOLANGCI_LINT_VERSION" 2>&1 | tail -1 && PATH="/home/build/bin:$PATH" golangci-lint run --timeout=5m'

  native-pr-tests:
    name: Native PR Tests
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Go paths for Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\go-cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\go-mod-cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\go-tmp" | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "GOCACHE=D:\go-cache"
          Add-Content -Path $env:GITHUB_ENV -Value "GOMODCACHE=D:\go-mod-cache"
          Add-Content -Path $env:GITHUB_ENV -Value "GOTMPDIR=D:\go-tmp"

      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: pkgconf
          path-type: inherit

      - name: Restore Go cache (macOS)
        if: matrix.os == 'macos'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-

      - name: Restore Go cache (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\go-mod-cache
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-

      - name: Download Go modules (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: go mod download

      - name: Download Go modules (non-Windows)
        if: matrix.os != 'windows'
        run: go mod download

      - name: Run native tests (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        env:
          GOMAXPROCS: 2
        run: |
          set -o pipefail
          go test -race \
            ./pkg/api \
            ./pkg/database/mediascanner \
            ./pkg/helpers \
            ./pkg/helpers/command \
            ./pkg/readers/externaldrive \
            ./pkg/platforms/shared/steam \
            ./pkg/platforms/shared/steam/steamtracker \
            ./pkg/service \
            ./pkg/service/backup \
            ./pkg/service/restart \
            ./pkg/ui/systray 2>&1 | tee go-test-output.txt

      - name: Run native tests (macOS)
        if: matrix.os == 'macos'
        run: |
          set -o pipefail
          go test -race \
            ./pkg/api \
            ./pkg/database/mediascanner \
            ./pkg/helpers \
            ./pkg/helpers/command \
            ./pkg/readers/externaldrive \
            ./pkg/platforms/shared/steam \
            ./pkg/platforms/shared/steam/steamtracker \
            ./pkg/service \
            ./pkg/service/backup \
            ./pkg/service/daemon \
            ./pkg/service/restart \
            ./pkg/ui/systray 2>&1 | tee go-test-output.txt

      - name: Summarize test failures
        if: failure()
        shell: bash
        run: .github/scripts/go-test-summary.sh go-test-output.txt "Native PR tests (${{ matrix.os }})"

      - name: Upload rapid failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapid-failures-native-${{ matrix.os }}
          path: '**/testdata/rapid/**/*.fail'
          if-no-files-found: ignore

  ci-status:
    name: CI Status
    if: always() && !cancelled()
    needs: [actionlint, c-sanitizers, lint, ci, deadlock, cross-lint, native-pr-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          if [ "${{ needs.actionlint.result }}" != "success" ]; then
            echo "CI failed: actionlint=${{ needs.actionlint.result }}"
            exit 1
          fi
          if [ "${{ needs.c-sanitizers.result }}" != "success" ]; then
            echo "CI failed: c-sanitizers=${{ needs.c-sanitizers.result }}"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "CI failed: lint=${{ needs.lint.result }}"
            exit 1
          fi
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed: ci=${{ needs.ci.result }}"
            exit 1
          fi
          if [ "${{ needs.deadlock.result }}" != "success" ]; then
            echo "CI failed: deadlock=${{ needs.deadlock.result }}"
            exit 1
          fi
          CROSS_RESULT="${{ needs.cross-lint.result }}"
          if [ "$CROSS_RESULT" != "success" ] && [ "$CROSS_RESULT" != "skipped" ]; then
            echo "CI failed: cross-lint=$CROSS_RESULT"
            exit 1
          fi
          NATIVE_RESULT="${{ needs.native-pr-tests.result }}"
          if [ "$NATIVE_RESULT" != "success" ] && [ "$NATIVE_RESULT" != "skipped" ]; then
            echo "CI failed: native-pr-tests=$NATIVE_RESULT"
            exit 1
          fi
          echo "CI passed"
